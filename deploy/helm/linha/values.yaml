replicaCount: 2
image:
  repository: ghcr.io/k3rnl/linha/server
  tag: 0.1.3
  pullPolicy: IfNotPresent
imagePullSecrets: []
database:
  postgres:
    host: postgres
    port: 5432
    database: linha
    sslMode: verify-full
    # Optional path to a CA mounted with extraVolumes/extraVolumeMounts.
    sslRootCert: ""
    secretRef: linha-postgres
    usernameKey: username
    passwordKey: password
security:
  # false disables public and worker authentication. All clients share one owner.
  enabled: true
  api:
    # false makes only the SDK API anonymous; browser/worker authentication stay independent.
    enabled: true
    jwt:
      issuer: ""
      audience: linha
      tls:
        insecureSkipVerify: false
  oidc:
    # Browser administrator login only; the API has its own issuer and audience.
    enabled: true
    issuer: ""
    tls:
      # Only OIDC HTTPS; skips certificate-chain and hostname verification.
      insecureSkipVerify: false
  # Membership rules inherit oidc.issuer; no per-rule issuer is needed.
  admin:
    viewer:
      subjects: []
      claims: []
    operator:
      subjects: []
      claims: []
rbac:
  # true: only namespaced Roles; verify workers with Kubernetes signing keys.
  # false: additionally grant cluster-scoped TokenReview for worker verification.
  # In both cases all drivers/executors are confined to the release namespace.
  namespaceOnly: true
allowedImages: []
local:
  enabled: false
  root: /var/lib/linha/results
  existingClaim: ""
s3:
  enabled: false
  secretRef: linha-s3
  destinationsKey: destinations
# Legacy administrator mounts, included in new context template snapshots.
workerVolumes: []
workerMounts: []
# Defaults merged with client templates and snapshotted for each new context.
workerPodTemplates:
  driverPodTemplate: {}
  executorPodTemplate: {}
# Names allowed in per-context imagePullSecrets. Top-level imagePullSecrets are
# also permitted. Only these Secrets get a namespaced get grant for digest lookup.
registrySecrets:
  allowedNames: []
results:
  # Opt in to deleting expired and abandoned allocated outputs. Job IDs stay.
  cleanup:
    enabled: false
  maxStagingBytes: 5368709120
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
# Embedded administrative console. No browser sessions/admin routes when disabled.
ui:
  enabled: false
  publicURL: ""
  # Optional same-origin UI/admin routing; host is inferred from publicURL.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  # Absolute browser lifetime; provider refresh renews authentication within this limit.
  sessionSeconds: 3600
  grafanaURL: ""
  oidc:
    clientId: ""
    # Replaces the defaults; openid is required. Add groups for group claims.
    scopes:
      - openid
      - profile
      - email
    secretRef: ""
    clientSecretKey: client-secret
metrics:
  enabled: true
  maxContexts: 100
  cluster: ""
  # Persistent owner/name -> alias overrides are applied only before enrollment.
  contextAliases: []
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
    sampleLimit: 100000
    relabelings: []
    metricRelabelings: []
    tlsConfig: {}
    authorization: {}
  grafanaDashboard:
    enabled: false
    labels: {}
    instanceSelector: {}
    folder: Linha
    datasourceUID: ""
    allowCrossNamespaceImport: false
    resyncPeriod: 10m
