name: checks
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linha
          POSTGRES_PASSWORD: linha-ci-only
          POSTGRES_DB: linha
        ports:
          - '5432:5432'
        options: >-
          --health-cmd="pg_isready -U linha -d linha"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      LINHA_TEST_DATABASE: postgres://linha:linha-ci-only@localhost:5432/linha?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: pip install PyYAML==6.0.3 && python3 scripts/test-helm.py
      - name: Check formatting
        run: |
          pip install -r requirements-format.txt
          python scripts/format-data.py --check
          black --check scripts
          sqlfluff lint --rules layout server/internal/postgres/*.sql
          mvn -B spotless:check
      - name: Check and build embedded admin console
        run: |
          npm --prefix web ci
          npm --prefix web run check
          npm --prefix web run build
          cd web
          npx playwright install --with-deps chromium
          npm test
      - run: make check
      - run: go test -race ./server/...
      - name: Admin response contracts and observability fixtures
        run: |
          # Cached test results do not recreate generated files or rerun measurements.
          LINHA_ADMIN_FIXTURE_OUTPUT=/tmp/linha-admin-fixtures.json go test -count=1 ./server/internal/httpapi -run TestAdminOpenAPIResponseFixtures
          LINHA_METRIC_LOAD=1 go test -count=1 -v ./server/internal/postgres -run TestMetricRetainedHistoryAndConcurrentScrapers
          pip install jsonschema==4.25.1
          python scripts/check-observability.py --fixtures /tmp/linha-admin-fixtures.json
      - name: Check release preparation and signed SDK artifacts
        run: |
          python3 scripts/test-release.py
          python3 scripts/check-release-artifacts.py
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: mvn -B package
      - run: make build && python3 scripts/e2e.py
      - run: pip install openapi-spec-validator==0.7.2 && python -m openapi_spec_validator api/openapi.json
      - run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict
